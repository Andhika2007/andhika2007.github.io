<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="profile">
    <!-- Replace foto.svg with the filename of your own photo. -->
    <img class="profile-photo" src="foto.png" alt="Foto profil" width="100" height="100">

    <!-- Replace these placeholders with your identity. -->
    <h1>Nama Masing-masing / NIM / Fakultas / Program Studi</h1>

    <!-- Replace username in every URL with your own account username. -->
    <nav aria-label="Akun media sosial">
      <ul class="social-links">
        <li><a href="https://x.com/username" target="_blank" rel="noopener noreferrer" aria-label="X (tab baru)"><span class="social-icon" aria-hidden="true">𝕏</span><span>X</span></a></li>
        <li><a href="https://github.com/username" target="_blank" rel="noopener noreferrer" aria-label="GitHub (tab baru)"><span class="social-icon" aria-hidden="true">GH</span><span>GitHub</span></a></li>
        <li><a href="https://www.instagram.com/username/" target="_blank" rel="noopener noreferrer" aria-label="Instagram (tab baru)"><span class="social-icon" aria-hidden="true">IG</span><span>IG</span></a></li>
        <li><a href="https://www.linkedin.com/in/username/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (tab baru)"><span class="social-icon" aria-hidden="true">in</span><span>LinkedIn</span></a></li>
        <li><a href="https://www.youtube.com/@username" target="_blank" rel="noopener noreferrer" aria-label="YouTube (tab baru)"><span class="social-icon" aria-hidden="true">▶</span><span>YouTube</span></a></li>
        <li><a href="https://www.facebook.com/username" target="_blank" rel="noopener noreferrer" aria-label="Facebook (tab baru)"><span class="social-icon" aria-hidden="true">f</span><span>Facebook</span></a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
